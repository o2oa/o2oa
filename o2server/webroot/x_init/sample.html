<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function h2Check() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    if (xmlh.status == 200) {
                        document.getElementById("msg").innerText = xmlh.responseText;
                    }
                }
            }
            xmlh.open("get", "/jaxrs/h2/check");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function h2Upgrade() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("get", "/jaxrs/h2/upgrade");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function h2UpgradeCancel() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("get", "/jaxrs/h2/upgrade/cancel");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function restoreUpload() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("post", "/jaxrs/restore/upload");
            var formData = new FormData();
            var file = document.getElementById("file").files[0];
            formData.append("file", file);
            xmlh.send(formData);
        }
        function restoreUploadCancel() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("get", "/jaxrs/restore/upload/cancel");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function secretSet() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("post", "/jaxrs/secret/set");
            xmlh.setRequestHeader("Content-Type", "application/json");
            var secret = document.getElementById("secret").value;
            xmlh.send(JSON.stringify({ secret: secret }));
        }
        function secretSetCancel() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                debugger;
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        //xmlh.responseText
                    }
                }
            }
            xmlh.open("get", "/jaxrs/secret/set/cancel");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function serverExecute() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        // nothing
                    }
                }
            }
            xmlh.open("get", "/jaxrs/server/execute");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
        function serverStop() {
            var xmlh;
            if (window.XMLHttpRequest) {
                xmlh = new XMLHttpRequest();
            } else {
                xmlh = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlh.onreadystatechange = function () {
                if (xmlh.readyState == 4) {
                    alert(xmlh.responseText)
                    if (xmlh.status == 200) {
                        // nothing
                    }
                }
            }
            xmlh.open("get", "/jaxrs/server/stop");
            xmlh.setRequestHeader("Content-Type", "application/json");
            xmlh.send();
        }
    </script>
</head>

<body>
    <H1>h2</H1>
    <div id="msg"></div>
    <button onclick="h2Check()">获取H2状态</button>
    <button onclick="h2Upgrade()">H2升级</button>
    <button onclick="h2UpgradeCancel()">取消H2升级</button>
    <H1>restore</H1>
    <input type="file" id="file" />
    <button onclick="restoreUpload()">上传初始数据</button>
    <button onclick="restoreUploadCancel()">取消上传初始数据</button>
    <H1>secret</H1>
    <input type="password" id="secret" />
    <button onclick="secretSet()">设置初始密码</button>
    <button onclick="secretSetCancel()">取消设置初始密码</button>
    <H1>server</H1>
    <button onclick="serverExecute()">执行初始服务器任务</button>
    <button onclick="serverStop()">停止初始服务器</button>
</body>

</html>
