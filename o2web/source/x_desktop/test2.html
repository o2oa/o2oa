    /**
     * 使用 SJCL 进行同步 AES-GCM 加密
     * @param {string} plainText - 待加密的 UTF-8 字符串
     * @param {string} keyString - 密钥字符串 (例如 16 字节)
     * @returns {string} Base64 编码的 [12字节IV] + [密文+Tag]
     */
    function encryptAesGcmSync(plainText, keyString) {
      // 1. 生成 12 字节随机 IV
      const ivBitArray = sjcl.random.randomWords(3); // 3 words = 96 bits = 12 bytes

      // 2. 将密钥字符串转为 bitArray
      const keyBitArray = sjcl.codec.utf8String.toBits(keyString);

      // 3. 将明文转为 bitArray
      const plaintextBitArray = sjcl.codec.utf8String.toBits(plainText);

      // 4. 创建 AES 加密器
      const cipher = new sjcl.cipher.aes(keyBitArray);

      // 5. GCM 模式加密
      const ciphertextBitArray = sjcl.mode.gcm.encrypt(
              cipher,
              plaintextBitArray,
              ivBitArray,
              [],   // adata
              128   // Tag 长度 128 位
      );

      // 6. 拼接 IV + 密文（含 Tag）
      const resultBitArray = sjcl.bitArray.concat(ivBitArray, ciphertextBitArray);

      // 7. 转 Base64
      return sjcl.codec.base64.fromBits(resultBitArray);
    }



    const TARGET_ID_PATTERN = /^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/;
    const ALLOWED_RETURN_PATHS = new Set(["/draft", "/approval", "/o2oa-embed/callback", "/document-ledger"]);

    // O2OA 约定密钥使用单 DES/ECB。三个相同密钥的 3DES EDE 与单 DES 密文相同，
    // 且 des-ede3 在 OpenSSL 3 默认 provider 中可用，无需依赖 legacy provider。

    export function ssoEncrypt(credential, ssoKey, nowMs) {
      // const key = Buffer.from(String(ssoKey || ""), "utf8").subarray(0, 8);
      // if (key.length !== 8) {
      //     throw new Error("O2OA_SSO_KEY 的 UTF-8 编码长度不能少于 8 字节");
      // }
      // const cipher = createCipheriv("des-ede3", Buffer.concat([key, key, key]), null);

      const plain = `${credential}#${nowMs}`;

      const utf8Bytes = new TextEncoder().encode(plain);

      const key = CryptoJS.MD5(ssoKey).toString();

      return encryptAesGcmSync(utf8Bytes, key);
    }

    export function validateNativeTargetId(value, fieldName = "target_id") {
      const id = String(value || "").trim();
      if (!TARGET_ID_PATTERN.test(id)) {
        const error = new Error(`${fieldName} 格式无效`);
        error.status = 400;
        throw error;
      }
      return id;
    }

    export function buildPortalReturnUrl(returnPath, frontendPublicUrl) {
      const rawPath = String(returnPath || "").trim();
      if (!rawPath.startsWith("/") || rawPath.startsWith("//") || rawPath.includes("\\")) {
        const error = new Error("return_path 必须是门户站内相对路径");
        error.status = 400;
        throw error;
      }

      let parsedPath;
      try {
        parsedPath = new URL(rawPath, "https://portal.invalid");
      } catch {
        const error = new Error("return_path 格式无效");
        error.status = 400;
        throw error;
      }
      if (parsedPath.origin !== "https://portal.invalid" || !ALLOWED_RETURN_PATHS.has(parsedPath.pathname)) {
        const error = new Error("return_path 仅允许 /draft、/approval、/o2oa-embed/callback 或 /document-ledger");
        error.status = 400;
        throw error;
      }
      const queryKeys = [...new Set(parsedPath.searchParams.keys())];
      if ((parsedPath.pathname === "/draft" || parsedPath.pathname === "/document-ledger") && queryKeys.length > 0) {
        const error = new Error(`${parsedPath.pathname} 回跳不允许查询参数`);
        error.status = 400;
        throw error;
      }
      if (parsedPath.pathname === "/o2oa-embed/callback" && queryKeys.length > 0) {
        const error = new Error("嵌入回跳不允许查询参数");
        error.status = 400;
        throw error;
      }
      if (parsedPath.pathname === "/approval") {
        const tab = parsedPath.searchParams.get("tab");
        if (queryKeys.length !== 1 || queryKeys[0] !== "tab" || !["pending", "done", "unread", "read", "my"].includes(tab)) {
          const error = new Error("/approval 回跳必须指定合法 tab");
          error.status = 400;
          throw error;
        }
      }

      let portalBase;
      try {
        portalBase = new URL(String(frontendPublicUrl || ""));
      } catch {
        throw new Error("原生页回跳未配置（需 OA_FRONTEND_PUBLIC_URL）");
      }
      if (!/^https?:$/.test(portalBase.protocol)) {
        throw new Error("OA_FRONTEND_PUBLIC_URL 必须使用 http 或 https");
      }
      return new URL(`${parsedPath.pathname}${parsedPath.search}`, portalBase).toString();
    }

    export function loadNativeSessionConfig(env = process.env) {
      const ssoClient = String(env.O2OA_SSO_CLIENT || "").trim();
      const ssoKey = String(env.O2OA_SSO_KEY || "");
      const publicUrl = String(
              env.O2OA_EMBED_PUBLIC_URL
              || env.O2OA_PUBLIC_URL
              || env.O2OA_SSO_PUBLIC_URL
              || env.O2OA_BASE_URL
              || "",
      ).replace(/\/+$/, "");
      let h5PublicUrl = String(env.O2OA_H5_PUBLIC_URL || "").replace(/\/+$/, "");
      if (!h5PublicUrl && publicUrl) {
        try {
          const derived = new URL(publicUrl);
          derived.port = "8086";
          h5PublicUrl = derived.origin;
        } catch {
          // 选择 H5 通道时返回明确的配置错误。
        }
      }
      const frontendPublicUrl = String(env.OA_FRONTEND_PUBLIC_URL || "").trim();
      if (!ssoClient || !ssoKey || !publicUrl || !frontendPublicUrl) {
        throw new Error("原生页 SSO 未配置（需 O2OA_SSO_CLIENT / O2OA_SSO_KEY / O2OA_PUBLIC_URL（或 O2OA_SSO_PUBLIC_URL）/ OA_FRONTEND_PUBLIC_URL）");
      }
      return { ssoClient, ssoKey, publicUrl, h5PublicUrl, frontendPublicUrl };
    }

    export async function prepareNativeSession(o2oa, token, env = process.env) {
      const config = loadNativeSessionConfig(env);
      if (!token) {
        const error = new Error("Missing user token");
        error.isAuthError = true;
        throw error;
      }
      const authResult = await o2oa.invoke(
              "x_organization_assemble_authentication",
              "/jaxrs/authentication",
              { token },
      );
      const person = authResult.data || {};
      if (authResult.type !== "success" || !person.id) {
        const error = new Error(authResult.message || "无法获取当前用户信息");
        error.isAuthError = true;
        throw error;
      }
      if (person.tokenType === "anonymous" || person.name === "anonymous") {
        const error = new Error("登录已失效，请重新登录");
        error.isAuthError = true;
        throw error;
      }
      const credential = person.employee || person.distinguishedName;
      if (!credential) throw new Error("当前用户缺少登录账号（employee/distinguishedName 均为空）");
      return { config, credential, person, newToken: authResult.newToken || null };
    }

    export function buildNativeSessionUrl({ session, targetType, targetId, formId, returnPath, docTitle, channel = "web", nowMs = Date.now() }) {
      const id = validateNativeTargetId(targetId, targetType === "draft" ? "draft_id" : "work_id");
      if (targetType !== "draft" && targetType !== "work") {
        const error = new Error("不支持的原生页目标类型");
        error.status = 400;
        throw error;
      }
      if (channel !== "web" && channel !== "h5") {
        const error = new Error("channel 必须是 h5 或 web");
        error.status = 400;
        throw error;
      }
      if (channel === "h5" && targetType !== "work") {
        const error = new Error("H5 原生页只支持已存在的工作实例");
        error.status = 400;
        throw error;
      }
      const publicUrl = channel === "h5" ? session.config.h5PublicUrl : session.config.publicUrl;
      if (!publicUrl) {
        const error = new Error("H5 原生页未配置入口（需 O2OA_H5_PUBLIC_URL）");
        error.status = 500;
        throw error;
      }
      if (channel === "h5") {
        const workUrl = new URL("/x_desktop/workmobilewithaction.html", publicUrl);
        workUrl.searchParams.set("workId", id);
        const ssoUrl = new URL("/x_desktop/gssso.html", publicUrl);
        ssoUrl.searchParams.set("xtoken", ssoEncrypt(session.credential, session.config.ssoKey, nowMs));
        ssoUrl.searchParams.set("client", session.config.ssoClient);
        ssoUrl.searchParams.set("redirect", `${workUrl.pathname}${workUrl.search}`);
        return ssoUrl.toString();
      }
      const returnUrl = buildPortalReturnUrl(returnPath, session.config.frontendPublicUrl);
      const idParam = targetType === "draft" ? "draftid" : "workid";
      const workUrl = new URL("/x_desktop/work.html", publicUrl);
      workUrl.searchParams.set(idParam, id);
      if (formId) workUrl.searchParams.set("formid", validateNativeTargetId(formId, "form_id"));
      // docTitle 透传到原生页 URL，由表单 postLoad 读取后覆盖浏览器 tab 标题（默认是「工作」）。
      if (docTitle) workUrl.searchParams.set("docTitle", docTitle);
      workUrl.searchParams.set("returnUrl", returnUrl);
      // O2OA 内置的移动端/回跳逻辑读取 redirectlink；现有云公文模板顶部返回读取 returnUrl。
      // 两者同时提供，兼容原生页不同关闭路径。
      workUrl.searchParams.set("redirectlink", returnUrl);

      const ssoUrl = new URL("/x_desktop/sso.html", publicUrl);
      ssoUrl.searchParams.set("xtoken", ssoEncrypt(session.credential, session.config.ssoKey, nowMs));
      ssoUrl.searchParams.set("client", session.config.ssoClient);
      ssoUrl.searchParams.set("redirect", `${workUrl.pathname}${workUrl.search}`);
      return ssoUrl.toString();
    }

    export function buildNativeInlineDraftSessionUrl({ session, draft, formId, returnPath, docTitle, nowMs = Date.now() }) {
      if (!draft || typeof draft !== "object" || Array.isArray(draft) || !draft.process) {
        const error = new Error("原生起草页缺少有效的流程草稿骨架");
        error.status = 400;
        throw error;
      }
      const returnUrl = buildPortalReturnUrl(returnPath, session.config.frontendPublicUrl);
      const workUrl = new URL("/x_desktop/work.html", session.config.publicUrl);
      // O2OA 原生入口在草稿模式下把 draw 返回的未落库 work 作为 options.draft
      // 交给 process.Work；表单首次流转时才 saveDraft + startDraft。
      workUrl.searchParams.set("draft", JSON.stringify(draft));
      if (formId) workUrl.searchParams.set("formid", validateNativeTargetId(formId, "form_id"));
      // docTitle 透传到原生页 URL，由表单 postLoad 读取后覆盖浏览器 tab 标题（默认是「工作」）。
      if (docTitle) workUrl.searchParams.set("docTitle", docTitle);
      workUrl.searchParams.set("returnUrl", returnUrl);
      workUrl.searchParams.set("redirectlink", returnUrl);

      const ssoUrl = new URL("/x_desktop/sso.html", session.config.publicUrl);
      ssoUrl.searchParams.set("xtoken", ssoEncrypt(session.credential, session.config.ssoKey, nowMs));
      ssoUrl.searchParams.set("client", session.config.ssoClient);
      ssoUrl.searchParams.set("redirect", `${workUrl.pathname}${workUrl.search}`);
      return ssoUrl.toString();
    }

    function crypDES (value, key) {
      var keyHex = CryptoJS.enc.Utf8.parse(key);
      var xtoken = CryptoJS.DES.encrypt(value, keyHex, {
        mode: CryptoJS.mode.ECB,
        padding: CryptoJS.pad.Pkcs7
      });
      var str = xtoken.ciphertext.toString(CryptoJS.enc.Base64);
      str = str.replace(/=/g, "");
      str = str.replace(/\+/g, "-");
      str = str.replace(/\//g, "_");
      return str;
    }

    var person = "admin";
    var timestamp = new Date().getTime();
    var key = "12345678";
    var token = crypDES( person + "#" + timestamp, key );

    const ssoUrl = new URL("/x_desktop/sso.html", window.location.origin);
    ssoUrl.searchParams.set("xtoken", token);
    ssoUrl.searchParams.set("client", 'devp');
    window.location = ssoUrl.toString();

  </script>
