<div class="o2_query_SSDNode" data-o2-element="statementDesignerArea">
    <div class="o2_query_SSDStatementListNode">
        <div class="o2_query_SSDStatementListTitleNode">
            <div class="o2_query_SSDStatementListTitleSelectNode" data-o2-events="click:selectStatement" title="{{$.lp.selectStatement}}"></div>
            <div class="o2_query_SSDStatementListTitleAddNode" data-o2-events="click:addStatement" title="{{$.lp.addStatement}}"></div>
            <div class="o2_query_SSDStatementListTitleTextNode">{{$.lp.statement}}</div>
        </div>
        <div class="o2_query_SSDStatementListContentNode" data-o2-element="statementListContent">
            <div class="o2_query_SSDStatementListEmptyNode" data-o2-element="statementEmptyNode">
                <div>{{$.lp.noStatementNote}}</div>
                <div>
                    {{$.lp.please}}<span class='o2_query_SSDStatementTextActionNode' data-o2-events="click:addStatement">{{$.lp.add}}</span>{{$.lp.or}}<span class='o2_query_SSDStatementTextActionNode' data-o2-events="click:selectStatement">{{$.lp.select}}</span>{{$.lp.statement}}
                </div>
            </div>
        </div>
    </div>
    <div class="o2_query_SSDStatementNode">
        <div class="o2_query_SSDStatementListTitleNode">
            <div class="o2_query_SSDStatementListTitleTextNode">{{$.lp.statementDetail}}</div>
            <div class="o2_query_SSDStatementListTitleDeleteNode" data-o2-element="deleteItemNode" data-o2-events="click:deleteItem" title="{{$.lp.delete}}"></div>
            <div class="o2_query_SSDStatementListTitleEditNode" data-o2-element="editItemNode" data-o2-events="click:editItem" title="{{$.lp.edit}}"></div>
            <div class="o2_query_SSDStatementListTitleReloadNode" data-o2-element="reloadItemNode" data-o2-events="click:reloadItem" title="{{$.lp.reload}}"></div>
        </div>
        <div class="o2_query_SSDStatementEmptyNode" data-o2-element="detailEmptyNode">
            <div>{{$.lp.noStatementDetailNote}}</div>
        </div>
        <div class="o2_query_SSDStatementDetailNode" data-o2-element="statementDetailNode">
        </div>
    </div>
</div>

<div class="o2_query_SSDResizeNode" data-o2-element="resizeNode"></div>

<div class="o2_query_SSDRunNode" data-o2-element="runArea">
    <div class="o2_query_SSDRunTitleNode">{{$.lp.testStatement}}</div>
    <div class="o2_query_SSDRunContentNode" data-o2-element="runContentNode">
        <div class="o2_query_SSDRunJsonNode" data-o2-element="runJsonNode">
        </div>
        <div class="o2_query_SSDRunActionNode" data-o2-element="runActionNode">
            <div class="o2_query_SSDRunActionContent" data-o2-events="click:runStatement"></div>
        </div>
        <div class="o2_query_SSDRunResultNode" data-o2-element="runResultNode">
        </div>
    </div>
</div>

<div class="o2_query_SSDResizeNode" data-o2-element="resizeNode2"></div>
