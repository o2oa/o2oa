<main>
    <div class="info">
        <div class="logo"></div>
        <div class="info-content">
            <div oo-if="$.step===0" class="info-content-init">
                <div class="welcome">欢迎使用</div>
                <div class="system-name">O2OA(翱途)</div>
                <div class="system-name">企业应用开发平台</div>
                <div class="info-text">首次启动服务器需要进行服务器初始化配置</div>
            </div>
            <explain oo-else :explain="$.explain[$.step]"></explain>
        </div>
    </div>
    <div class="content">
        <div class="pane" oo-element="paneNode">
            <div class="pane_layout">
                <system-title oo-if="$.step===0" :title="$.title"></system-title>
                <password oo-if="$.step===1" :secret="$.secret"></password>
                <database oo-if="$.step===2" :database="$.database"></database>
                <restore oo-if="$.step===3" :restore="$.restore"></restore>
                <init-info oo-if="$.step===4" oo-prop="$"></init-info>
                <execute oo-if="$.step===5" oo-prop="$"></execute>
                <stop-init oo-if="$.step===6" oo-prop="$"></stop-init>
            </div>
        </div>
    </div>
    <!-- <div class="bottom"></div> -->
</main>
