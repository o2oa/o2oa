<!-- 假期类型规则 -->
<div style="display: flex; flex-direction: column;" >
    <div class="index_page_header_container">
        <div class="index_page_header_title"><button style="margin-left: 0;margin-right: 10px;"
                @click="clickBackTypeList"><i class="ooicon-process-goback"></i></button> {{
            $.lp.leaveManagerV2.leaveTypeTitle }}</div>
    </div>
    <div class="manager-box-content">
        <div style="margin: 10px 0;float: left;display: flex; align-items: center;">
            <!--人员组织选择  -->
            <div class="margin-right">
                <o-org-person-selector
                    oo-prop="{'isRequried': true, 'selectorTitle': $.lp.leaveManagerV2.account.filterSelectTitle,  'placeholder': $.lp.leaveManagerV2.account.filterEmptyPlaceholder, 'value': $.filterList}"
                    oo-model="filterList"></o-org-person-selector>
            </div>
 
            <div class="margin-top margin-right">
                <button class="mainColor_bg" @click="search">{{$.lp.search}}</button>
            </div>
        </div>
    </div>
</div>
