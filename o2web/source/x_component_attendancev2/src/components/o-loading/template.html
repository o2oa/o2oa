<div class="o2-mask-container" style="position: fixed; opacity: 1; width: auto; height: auto; top: 0; right: 0; bottom: 0; left: 0; border-radius: 0; z-index: 9999;">
  <iframe class="o2-mask" style="position: absolute; opacity: 0.8; width: 100%; height: 100%; top: 0; border: 0; left: 0; z-index: 9999;" ></iframe>
  <div class="o2-mask-backgroundBar" style="position: absolute; opacity: 0.8; width: 100%; height: 100%; top: 0; border-radius: 0; background-color: #f1f1f1; left: 0; z-index: 10000;"></div>
  <div class="o2-mask-loadingBar" style="width: 160px; height: 60px; position: absolute; text-align: center; opacity: 1; top: 0; left: 0; font-size: 12px; z-index: 10001;">
      <table width="80%" border="0" cellspacing="0" cellpadding="0">
          <tr valign="middle" height="60">
              <td align="right"><img src="../../assets/loading.gif" /></td>
              <td align="center">{{$.text}}</td>
          </tr>
      </table>
  </div>
</div>
