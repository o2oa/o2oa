<div class="breadcrumb-content" data-o2-element="topNode">
    {{if $.categories.length > 0}}
        <oo-select value="all"
                   data-o2-events="o2load:handLoadCategory;
                                    change:handleChangeCategory">
        </oo-select>
    {{end if}}
    {{if $.creatable}}
    <div
            class="breadcrumb-menu-create"
            data-o2-events="click:handleCreate;">
        <i class="breadcrumb-menu-item-icon ooicon-create"></i>
        <span>新建</span>
    </div>
    {{end if}}

    <div class="breadcrumb-menu" data-o2-element="menuNode">
        {{each $.data}}
        <div
                data-category="{{$.category}}"
                class="breadcrumb-menu-item"
                data-o2-events="click:handleClick;
                                mouseleave:handleMouseLeave;
                                mouseenter:handleMouseEnter;
                                o2load:handleLoadItem;">
            {{if $.ooicon}}
            <i class="breadcrumb-menu-item-ooicon ooicon-{{$.ooicon}}"></i>
            {{end if}}
            {{if $.icon}}
            <i class="breadcrumb-menu-item-icon" style="background-image:url(data:image/png;base64,{{$.icon}});"></i>
            {{end if}}
            {{if !$.icon && $.defaultIcon}}
            <i class="breadcrumb-menu-item-icon" style="background-image:url({{$.defaultIcon}});"></i>
            {{end if}}
            <span class="breadcrumb-menu-item-text">{{$.name}}
            </span>
        </div>
        {{end each}}
    </div>
</div>
