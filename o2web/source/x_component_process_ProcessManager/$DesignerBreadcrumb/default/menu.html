<div class="breadcrumb-menu" data-o2-element="menu">
    {{each $.data}}
    <div
            class="breadcrumb-menu-item"
            data-o2-events="click:handleClick;
                            mouseleave:handleMouseLeave;
                            mouseenter:handleMouseEnter;
                            o2load:handleLoadItem;">
        {{$.name}}
    </div>
    {{end each}}
</div>
