<div class="breadcrumb-menu" data-o2-element="menu">
    {{each $.data}}
    <div
            class="breadcrumb-menu-item"
            data-o2-events="click:handleClick;
                            mouseleave:handleMouseLeave;
                            mouseenter:handleMouseEnter;
                            o2load:handleLoadItem;">
        {{if $.icon}}
        <i class="breadcrumb-menu-item-icon ooicon-{{$.icon}}"></i>
        {{end if}}
        <span class="breadcrumb-menu-item-text">{{$.name}}</span>
<!--        {{if $.children}}-->
<!--        <i class="breadcrumb-menu-item-arrow ooicon-drop_down"></i>-->
<!--        {{end if}}-->
    </div>
    {{end each}}
</div>
