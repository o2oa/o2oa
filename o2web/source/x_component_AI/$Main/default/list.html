<div class="page">
    <div class="chat-top" data-o2-element="titleNode">
        新建会话
    </div>
    <div class="chat-list-wrap" data-o2-element="chatListWrapNode">
        <div class="chat-list" data-o2-element="chatListNode">
        </div>
    </div>
    <div class="chat-wrap" style="width: 65rem;margin:1.3rem 0 ">
        <div class="chat-input"><textarea placeholder="{{$.lp.types.auto}}"
                                          data-o2-element="chatNode"></textarea></div>
        <div class="chat-tools">
            <div class="chat-tools-l">
                <div data-o2-element="tool1Node" class="chat-tools-cur ooicon-networking_click"></div>
                <div data-o2-element="tool2Node" class="chat-tools-cur" style="cursor: pointer;"
                     data-o2-events="click:showGenerateType">{{$.lp.types.auto}}
                </div>
                <div>｜</div>
                <div data-o2-element="tool3Node">{{$.lp.types.auto_text}}</div>
            </div>
            <div class="ooicon-voice" style="width: 2.3rem;font-size: 1.8rem;display: none;" data-o2-events="click:speech" data-o2-element="speechNode"></div>
            <div data-o2-element="btnSendNode" data-o2-events="click:sendNew">
                <div class="btn">
                    <i class="ooicon-send1"></i>
                </div>
            </div>
            <div data-o2-element="btnCancelNode" data-o2-events="click:stop" style="display: none">
                <div class="btn" style="color: #fff;background: #2E82F7;">
                    <i class="ooicon-stop1"></i>
                </div>
            </div>

        </div>
    </div>
</div>
